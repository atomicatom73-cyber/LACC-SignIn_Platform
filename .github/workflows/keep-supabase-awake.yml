# Keeps the studio's free-plan Supabase project from pausing.
#
# Supabase pauses a free project after about a week with no activity. Normally
# the app keeps it busy, but when the Vercel side is down (as it was from
# 2026-11-08 to 2026-12-08, blocked for going over the Hobby CPU allowance)
# nothing touches the database: the kiosk shows Vercel's error page, and the
# daily calendar/members-sheet crons run on Vercel too. A paused project needs
# someone with the studio's Supabase login to restore it, so this runs one tiny
# read-only query a day instead.
#
# It calls studio_pulse() twice, because Supabase doesn't say exactly what it
# counts as activity: once through the REST API, the way browsers reach it
# (SUPABASE_URL + SUPABASE_ANON_KEY secrets), and once as a direct database
# query (SUPABASE_DB_URL, the session pooler URL deploy.yml uses). The function
# is cheap and read-only. Only the timestamp is printed, because this repo is
# public and so are its Actions logs. The job fails only if both calls fail.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 15 * * *" # daily, ~8-9am in Denver
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          set -o pipefail
          ok=0

          if now=$(curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/studio_pulse" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                -H "Content-Type: application/json" -d '{}' | jq -r .now); then
            echo "REST API answered at $now" | tee -a "$GITHUB_STEP_SUMMARY"
            ok=1
          else
            echo "::warning::REST API ping failed"
          fi

          if now=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select public.studio_pulse()->>'now'"); then
            echo "Database answered at $now" | tee -a "$GITHUB_STEP_SUMMARY"
            ok=1
          else
            echo "::warning::Direct database query failed"
          fi

          [ "$ok" = 1 ]
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
